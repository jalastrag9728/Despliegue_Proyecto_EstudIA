# Proxy inverso de Nodo Ruta: UNICO punto de acceso hacia app1 y app2.
#
# Que hace:
#  - Reparte las consultas por turnos (round robin) entre las instancias.
#  - Si una instancia no responde (conexion rechazada o demora), reintenta la MISMA consulta
#    en la otra: el usuario normalmente no nota la caida. Esto es deteccion PASIVA: NGINX se
#    entera del fallo cuando intenta usar la instancia (no hace /health por su cuenta).
#  - Vuelve a resolver los nombres app1/app2 con el DNS de Docker (requiere NGINX >= 1.27.3),
#    asi puede iniciar aunque una instancia no exista y la reintegra cuando reaparece.
#  - Escribe en el registro que instancia (upstream) atendio cada consulta y con que codigo.
#
# Para agregar una tercera instancia: ver docs/ESCALAR.md (una linea "server app3:8080 resolve;").

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format proxylog '$time_iso8601 cliente=$remote_addr "$request" '
                        'http=$status upstream=$upstream_addr upstream_http=$upstream_status '
                        'tiempo_upstream_s=$upstream_response_time';
    access_log /dev/stdout proxylog;

    # DNS interno de Docker; se vuelve a consultar cada 5 s
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream nodoruta {
        zone nodoruta 64k;
        # max_fails/fail_timeout: tras 1 fallo de conexion, esa instancia se "descansa" 5 s
        server app1:8080 resolve max_fails=1 fail_timeout=5s;
        server app2:8080 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_tokens off;

        location / {
            proxy_pass http://nodoruta;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;

            # Reintenta en otra instancia SOLO ante errores de conexion o demora.
            # No se incluye http_503 a proposito: un 503 de /health significa "datos danados"
            # (afecta a TODAS las instancias) y debe verse como 503, no ocultarse ni dejar
            # a las instancias marcadas como caidas despues de restaurar.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
        }
    }
}
