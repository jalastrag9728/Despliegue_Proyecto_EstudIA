# Opcional: publica la imagen del servicio en el registro gratuito de GitHub (GHCR) al crear una etiqueta "v1.0.0".
# No usa secretos propios: emplea el GITHUB_TOKEN que GitHub entrega automáticamente.
name: Publicar imagen

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}/nodoruta-app" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.ref_name }}
            ${{ env.IMAGEN }}:latest
