name: CI - validar y probar el MVP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar código y configuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas locales (sin Docker)
        run: python -m unittest discover -s tests -v
      - name: Sintaxis de scripts y app Django
        run: python -m py_compile app.py manage.py nodoruta_web/*.py scripts/datos.py scripts/verificar_servicio.py scripts/ejecutar_local.py scripts/pruebas_automaticas.py
      - name: Validar compose.yaml
        run: |
          mkdir -p data && cp pedidos.json data/pedidos.json
          docker compose config -q
      - name: Validar configuración de NGINX
        run: |
          docker run --rm --add-host app1:127.0.0.1 --add-host app2:127.0.0.1 \
            -v "$PWD/proxy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.28-alpine nginx -t

  pruebas-despliegue:
    name: Pruebas I01-I05 (despliegue real)
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas automáticas
        run: python scripts/pruebas_automaticas.py --reiniciar-datos --limpiar
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias/
      - name: Publicar resumen en GitHub Actions
        if: always()
        run: |
          INFORME=$(find evidencias -name "INFORME.md" | head -n 1 || true)
          if [ -n "$INFORME" ]; then
            cat "$INFORME" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó INFORME.md en evidencias/." >> "$GITHUB_STEP_SUMMARY"
          fi
