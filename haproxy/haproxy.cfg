# Balanceador / proxy inverso: único punto de acceso (puerto 8080) hacia las instancias de "app".
# - Reparte solicitudes por turnos (roundrobin).
# - Comprueba la salud de cada instancia con GET /health cada 2 s.
# - Si una instancia cae, la saca de la rotación y reintenta la solicitud en otra.
# - Descubre las instancias por DNS de Docker: para escalar basta subir REPLICAS (máx. 6 aquí).

global
    log stdout format raw local0
    maxconn 512

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option redispatch            # si el servidor elegido falla, prueba con otro
    retries 3
    timeout connect 2s
    timeout client  15s
    timeout server  15s
    timeout http-request 10s
    timeout check   2s

# Resolución dinámica de nombres usando el DNS interno de Docker
resolvers docker
    nameserver dns1 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s

frontend entrada
    bind *:8080
    default_backend servicio

backend servicio
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host nodoruta
    http-check expect status 200
    # inter: cada cuánto se revisa | fall: fallos para marcar "caído" | rise: aciertos para marcar "sano"
    default-server check inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server-template app 6 app:8000

# Panel de estado (solo visible desde su propio computador, ver docker-compose.yml)
frontend estado
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
